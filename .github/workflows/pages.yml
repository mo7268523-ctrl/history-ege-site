name: Публикация карточек на GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'site-small-055.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      import_release:
        description: 'Обновить файлы по проверенной описи publication.json'
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить рабочую версию из GitHub
        uses: actions/checkout@v4
      - name: Первичный перенос и сверка опубликованной версии
        if: ${{ hashFiles('site/index.html') == '' || inputs.import_release == true }}
        run: |
          python3 tools/import_public_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site
          if ! git diff --cached --quiet; then
            git commit -m 'Сохранить проверенные файлы публичного выпуска'
            git push origin HEAD:main
          fi
      - name: Проверить наличие приложения и локальных ресурсов
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.parse
          root = pathlib.Path('site')
          html = (root / 'index.html').read_text()
          for link in re.findall(r'(?:src|href)="([^"]+)"', html):
              path = urllib.parse.urlsplit(link).path
              if path and not link.startswith(('http:', 'https:', '#', '/')):
                  assert (root / path).is_file(), path
          print('Файлы запуска доступны')
          PY
      - name: Настроить Pages
        uses: actions/configure-pages@v5
      - name: Загрузить только приложение
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Дождаться появления артефакта текущей попытки
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for delay in 0 3 5 8 12 16; do
            sleep "$delay"
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '[.artifacts[] | select(.expired == false)] | length') && [ "$count" = 1 ]; then
              exit 0
            fi
          done
          echo "Артефакт $PAGES_ARTIFACT недоступен для публикации" >&2
          exit 1
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
